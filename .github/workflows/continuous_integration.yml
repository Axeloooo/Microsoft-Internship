name: Continuous Integration

on:
  pull_request:
    branches:
      - devel
      - main

jobs:
  build:
    name: Build and Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.23
        id: cuda-toolkit
        with:
          cuda: "12.5.0"
          method: "network"

      - name: Install OpenMPI
        run: sudo apt-get update && sudo apt-get install -y openmpi-bin libopenmpi-dev

      - name: Install NCCL
        run: sudo apt-get update && sudo apt-get install -y libnccl2 libnccl-dev

      - name: Build kernels
        run: make build
