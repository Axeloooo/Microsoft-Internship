name: Continuous Integration

on:
  pull_request:
    branches:
      - devel
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: nvcr.io/nvidia/pytorch:24.12-py3
      credentials:
        username: ${{ secrets.NGC_USERNAME }}
        password: ${{ secrets.NGC_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - run: make build
