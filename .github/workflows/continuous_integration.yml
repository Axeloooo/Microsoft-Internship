name: Continuous Integration

on:
  pull_request:
    branches:
      - devel
      - main

jobs:
  build:
    name: Build and Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.23
        id: cuda-toolkit
        with:
          cuda: "12.5.0"
          method: "network"

      - name: Build reduction
        run: |
          cd src/reduction
          make build

      - name: Build vector add
        run: |
          cd src/vector_add
          make build

      - name: Build dot product
        run: |
          cd src/dot_product
          make build

      - name: Build axpy
        run: |
          cd src/axpy
          make build
